name: Nightly Naver Land Crawler

on:
  schedule:
    # 매일 한국시간 기준 23:00 (UTC 14:00) 자동 실행
    - cron: '0 14 * * *'
  workflow_dispatch: # GitHub 웹 콘솔 수동 실행 허용

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      # 1. 최신 v4 버전으로 업데이트 (Node.js 24 환경 완벽 지원 및 경고 제거)
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. 최신 v5 버전으로 업데이트 및 pip 패키지 캐싱 설정
      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 패키지 다운로드 속도 최적화

      # 3. 수집에 필요한 최신 파이썬 라이브러리 설치
      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 네이버 부동산 야간 크롤러 구동 및 GAS 저장
      - name: 크롤러 실행 및 구글 시트 전송
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          python crawler.py
