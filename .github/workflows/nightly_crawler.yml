name: Nightly Naver Land Crawler

on:
  schedule:
    # 매일 한국 시간 23:00 (UTC 14:00) 정기 실행
    - cron: '0 14 * * *'
  # Streamlit UI 수동 실행 요청을 받기 위한 필수 이벤트
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롤러 실행 및 구글 시트 전송
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          python crawler.py
