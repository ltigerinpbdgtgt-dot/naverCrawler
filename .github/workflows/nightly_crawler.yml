name: Nightly Naver Land Crawler

on:
  schedule:
    # UTC 14:00 = KST 23:00 (매일 밤 11시 실행)
    - cron: '0 14 * * *'
  workflow_dispatch: # 깃허브 웹에서 수동 실행 허용

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 의존성 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 크롤러 야간 자동 순회 실행
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          python crawler.py
